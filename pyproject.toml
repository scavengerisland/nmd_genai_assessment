[project]
name = "genai-assessment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
